    html, body {

  <script>
    // 解決 iOS 設備上軟體鍵盤收起後的畫面向上殘留偏移與抖動問題
    (function() {
      var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || 
                  (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      
      function resetScrollPosition() {
        if (window.scrollY !== 0 || (document.documentElement && document.documentElement.scrollTop !== 0)) {
          window.scrollTo(0, 0);
          document.body.scrollTop = 0;
          if (document.documentElement) {
            document.documentElement.scrollTop = 0;
          }
        }
      }

      // 輸入框失焦或鍵盤收起時強制歸位
      window.addEventListener('focusout', function(e) {
        setTimeout(resetScrollPosition, 30);
        setTimeout(resetScrollPosition, 150);
        setTimeout(resetScrollPosition, 320);
      });

      if (window.visualViewport) {
        var lastHeight = window.visualViewport.height;
        window.visualViewport.addEventListener('resize', function() {
          var currHeight = window.visualViewport.height;
          // 當視窗高度變大（鍵盤收起）時即時平滑歸位
          if (currHeight > lastHeight && currHeight >= window.innerHeight * 0.75) {
            resetScrollPosition();
          }
          lastHeight = currHeight;
        });

        window.visualViewport.addEventListener('scroll', function() {
          if (window.visualViewport.offsetTop > 0 && window.visualViewport.height >= window.innerHeight * 0.75) {
            resetScrollPosition();
          }
        });
      }
    })();
  </script>
