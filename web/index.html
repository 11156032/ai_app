  <style>
    html, body {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      /* 關鍵優化：關閉瀏覽器原生橡皮筋回彈，交由 Flutter 內部 ScrollPhysics 處理 */
      overscroll-behavior: none;
      overscroll-behavior-y: none;
      overscroll-behavior-x: none;
      touch-action: manipulation;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      background-color: #FAFAFA;
    }
    #flutter_container, flt-glass-pane, flutter-view {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      /* 啟用 GPU 硬體加速層 */
      transform: translateZ(0);
      -webkit-transform: translateZ(0);
      will-change: transform;
    }
    /* 防止 iOS Safari 在輸入框聚焦時自動放大頁面導致鍵盤收起時版面偏移跳動 */
    input, textarea, select, .flt-text-editing, [contenteditable="true"] {
      font-size: 16px !important;
      -webkit-text-size-adjust: 100%;
    }
  </style>
  <script>
    // 平滑處理 iOS Safari 鍵盤收起後的畫面歸位，避免劇烈彈跳
    (function() {
      var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || 
                  (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      if (!isIOS) return;

      var resetTimer = null;
      function smoothReset() {
        if (window.scrollY !== 0 || (document.body && document.body.scrollTop !== 0) || (document.documentElement && document.documentElement.scrollTop !== 0)) {
          window.scrollTo(0, 0);
          if (document.body) document.body.scrollTop = 0;
          if (document.documentElement) document.documentElement.scrollTop = 0;
        }
      }

      // 自然收起鍵盤：當點擊輸入框外部任意畫布區域時，自動觸發 blur 讓 iOS 鍵盤自然平滑退場
      window.addEventListener('pointerdown', function(e) {
        var active = document.activeElement;
        if (active && (active.tagName === 'INPUT' || active.tagName === 'TEXTAREA' || active.isContentEditable || (active.classList && active.classList.contains('flt-text-editing')))) {
          if (e.target !== active && !active.contains(e.target)) {
            active.blur();
          }
        }
      }, { passive: true });

      window.addEventListener('focusout', function() {
        clearTimeout(resetTimer);
        // 等待 iOS 鍵盤完全縮回動畫結束（約 300ms）後平滑校正一次，避免中途搶奪渲染造成跳動
        resetTimer = setTimeout(smoothReset, 320);
      });

      if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', function() {
          if (window.visualViewport.height >= window.innerHeight * 0.9) {
            clearTimeout(resetTimer);
            resetTimer = setTimeout(smoothReset, 150);
          }
        });
      }
    })();
  </script>
