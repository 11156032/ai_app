name: Flutter CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # ----------------------------------------------------
  # Job 1: 打包 Android APK 並發布到 Firebase App Distribution
  # ----------------------------------------------------
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          cache: true
          
      # 快取 Android Gradle 依賴
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # 動態生成 keys.env (安全性處理)
      - name: Generate keys.env file
        env:
          KEYS_ENV_CONTENT: ${{ secrets.KEYS_ENV_CONTENT }}
        run: |
          mkdir -p assets
          echo "$KEYS_ENV_CONTENT" > assets/keys.env

      - name: Install dependencies
        run: flutter pub get
        
      - name: Analyze project source
        run: flutter analyze
        
      - name: Run tests
        run: flutter test
        
      - name: Build Android APK
        if: github.ref == 'refs/heads/main'
        run: |
          BUILD_NUM=$(( 2001 + ${{ github.run_number }} ))
          flutter build apk --release --split-per-abi --build-number=$BUILD_NUM
      
      - name: Upload APK Artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: app-arm64-v8a-release-apk
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          
      - name: Upload to Firebase App Distribution
        if: github.ref == 'refs/heads/main'
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: "1:789026077383:android:5fd946ddc995cb3f761ce2"
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          file: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          releaseNotes: "Commit: ${{ github.event.head_commit.message }}"
          testers: "adenlee36@gmail.com"

  # ----------------------------------------------------
  # Job 2: 編譯 Flutter Web 並自動部署到 Cloudflare Pages
  # ----------------------------------------------------
  build-web-and-deploy:
    name: Build & Deploy Web to Cloudflare Pages
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          cache: true

      # 安全防禦：Web 編譯建立空白 keys.env 避免 pubspec 資源缺失報錯，絕不注入敏感金鑰
      - name: Prepare Safe Web Assets
        run: |
          mkdir -p assets
          touch assets/keys.env

      - name: Install dependencies
        run: flutter pub get

      # 1. 最佳化編譯 Web（啟用最高優化等級 O4 + 圖示裁剪 + 關閉 source-maps）
      - name: Build Flutter Web
        run: |
          flutter build web --release \
            --tree-shake-icons \
            --no-source-maps \
            -O4

      # 2. 安全防護：徹底清除 Web 輸出目錄中可能殘留之 .env 與設定檔
      - name: Sanitize and Secure Web Assets
        run: |
          find build/web -name "*.env" -type f -delete || true

      # 3. 自動為 Cloudflare Pages 注入 _headers 安全與快取規則
      - name: Setup Cloudflare Headers
        run: |
          cat << 'EOF' > build/web/_headers
          /*
            X-Content-Type-Options: nosniff
            X-Frame-Options: SAMEORIGIN
            Referrer-Policy: strict-origin-when-cross-origin
            Permissions-Policy: camera=(), microphone=*, geolocation=()
          
          # 靜態資源與 wasm 啟用永久快取
          /assets/*
            Cache-Control: public, max-age=31536000, immutable
          /canvaskit/*
            Cache-Control: public, max-age=31536000, immutable
          *.wasm
            Cache-Control: public, max-age=31536000, immutable
            Content-Type: application/wasm
          *.js
            Cache-Control: public, max-age=31536000, immutable

          # 進入點與 ServiceWorker 絕不快取
          /index.html
            Cache-Control: no-cache, no-store, must-revalidate
          /version.json
            Cache-Control: no-cache, no-store, must-revalidate
          /flutter_service_worker.js
            Cache-Control: no-cache, no-store, must-revalidate

          # 敏感檔案直接遮蔽
          /*.env
            Cache-Control: no-store
            X-Robots-Tag: noindex
          /assets/*.env
            Cache-Control: no-store
            X-Robots-Tag: noindex
          EOF

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy build/web --project-name=ai-app

